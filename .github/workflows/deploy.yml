name: Deploy Search Service to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Git LFS artifacts
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs
          key: lfs-v2-${{ hashFiles('biencoder_model/model.safetensors', 'index_data/embeddings.pt') }}

      - name: Pull runtime LFS artifacts
        run: |
          git lfs install
          git lfs pull --include="biencoder_model/model.safetensors,index_data/embeddings.pt"

      - name: Save Git LFS artifacts
        uses: actions/cache/save@v4
        with:
          path: .git/lfs
          key: lfs-v2-${{ hashFiles('biencoder_model/model.safetensors', 'index_data/embeddings.pt') }}

      - name: Reclaim duplicated Git LFS disk space
        run: |
          rm -rf .git/lfs/objects
          df -h /

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Search Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/turbo-metallurg-montazh/tmm-search-service:${{ github.sha }}
            ghcr.io/turbo-metallurg-montazh/tmm-search-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Deploy to k3s
        run: |
          echo "${{ secrets.K3S_KUBECONFIG }}" > kubeconfig
          kubectl --kubeconfig=kubeconfig apply -f k8s/ -R
          kubectl --kubeconfig=kubeconfig set image deployment/emk-search-service \
            search-service=ghcr.io/turbo-metallurg-montazh/tmm-search-service:${{ github.sha }} \
            -n search-service
