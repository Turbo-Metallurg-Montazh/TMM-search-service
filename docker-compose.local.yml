services:
  search-service:
    build:
      context: .
    container_name: emk-search-service-local
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/biencoder_model
      INDEX_DIR: /data/index_data
      PRICE_LIST_DIR: /data/price_lists
      DISABLE_REQUEST_GUARD: "true"
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAmkwbWMcIIsVsYSJut+1Y
        4EeI7vjI/It9BbiWsNhJVRQqSPeddDRa6lWIVuU3tmiylecyb5a+DGXaR6u/7OeG
        s51ppjAtOa1AglIHGkYyVhGU2vAVPeIOeporbD+qaTefljyM+cQ2hLhtbjXfgkK2
        fSRDa2ODVLLd6Vj3pkfngv3Qd794Fb1rPnmWm30XEszYbUxKSNQxlVM705bp7Dez
        neCxFssCzbd4G6Sl0YaFD+617KQrL0Pi/G5zt3q6obMwLQtERRq9ekwA3bBHOkBi
        Phyx53mKKCp0Pe3OBRPGGJfkyu/CQO5vt/zWCE7xx0o4luRRJ+fNuNeAtPXjUkbV
        ewIDAQAB
        -----END PUBLIC KEY-----
    ports:
      - "8000:8000"
    volumes:
      - search_index_data:/data/index_data
      - search_price_lists:/data/price_lists
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/index_data/embeddings.pt ]; then cp -a /app/index_data/. /data/index_data/; fi
        if [ -z "$$(find /data/price_lists -maxdepth 1 -type f -name '*.xls*' -print -quit)" ]; then cp -a /app/price_lists/. /data/price_lists/; fi
        exec uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  search_index_data:
  search_price_lists:
